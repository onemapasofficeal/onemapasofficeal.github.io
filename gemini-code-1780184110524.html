<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiyo Live 3D - Ultra Edition V3</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #030305; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        #app-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center;
            justify-content: flex-end;
        }

        #webcam {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            width: 140px; 
            height: 105px;
            object-fit: cover; 
            transform: scaleX(-1); 
            border-radius: 12px;
            border: 2px solid rgba(255, 71, 87, 0.6); 
            z-index: 5; 
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }

        #renderer-3d { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
        }

        .menu-controles {
            position: relative;
            margin-right: 30px;
            width: 300px; 
            background: rgba(6, 6, 10, 0.8); 
            border-radius: 24px;
            padding: 24px; 
            z-index: 10; 
            color: white; 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 71, 87, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .menu-titulo { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900; 
            color: #ff4757; 
        }

        .grid-opcoes { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .btn-opcao {
            background: rgba(255, 255, 255, 0.03); 
            color: #8f8f9e; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 14px 18px;
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700;
            text-transform: uppercase; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.25s ease;
        }

        .btn-opcao:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: translateX(-3px);
        }

        .btn-opcao.ativo { 
            background: linear-gradient(135deg, #ff4757, #ff6b81); 
            color: #fff; 
            border-color: #ff8b94; 
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
        
        .btn-opcao span {
            font-size: 9px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
        }

        #container-aviso {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #060609; color: white; z-index: 20;
        }

        .btn-permitir {
            background: #ff4757; color: white; border: none; padding: 18px 45px;
            font-size: 13px; font-weight: 800; border-radius: 40px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection" crossorigin="anonymous"></script>
</head>
<body>

    <div id="app-container">
        <div id="container-aviso">
            <p>CONECTANDO AO ENGINE INTAKE KAIYO EM ULTRA HD...</p>
            <button class="btn-permitir" onclick="inicializarSistemaCompleto()">Iniciar Rastreamento Tracking</button>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <div id="renderer-3d"></div>

        <div class="menu-controles">
            <div class="menu-titulo">Módulos de Elite Kaiyo</div>
            <div class="grid-opcoes">
                <button class="btn-opcao ativo" id="btn-rosto" onclick="alternarElemento('rosto')">Estrutura Rosto <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-cabelo" onclick="alternarElemento('cabelo')">Cabelo + Orelhas <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-olho" onclick="alternarElemento('olho')">Olhos Dourados <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-peitoral" onclick="alternarElemento('peitoral')">Peitoral Esculpido <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-tanquinhos" onclick="alternarElemento('tanquinhos')">Tanquinho 8-Pack <span>ON</span></button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const painelAviso = document.getElementById('container-aviso');
        
        let cena, camera, renderizador, modeloGrupo;
        let detectorRosto;
        let objetoAvatar = {};
        
        async function inicializarSistemaCompleto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 }, audio: false 
                });
                video.srcObject = stream;

                const modeloDeteccao = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
                detectorRosto = await faceLandmarksDetection.createDetector(modeloDeteccao, {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh'
                });

                painelAviso.style.display = 'none';
                
                initMundo3D();
                cicloRastreamentoVapor();

            } catch (err) {
                console.error(err);
                alert("Erro crítico ao carregar câmera ou IA.");
            }
        }

        function initMundo3D() {
            const container = document.getElementById('renderer-3d');
            cena = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Ajustado foco centralizado compensando o menu lateral lateralizado
            camera.position.set(-0.5, -0.1, 5.0);

            renderizador = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderizador.setSize(window.innerWidth, window.innerHeight);
            renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderizador.domElement);

            // Iluminação balanceada e agressiva para dar volume nos gomos
            cena.add(new THREE.AmbientLight(0x555566, 1.5));
            
            const neonEsquerdo = new THREE.DirectionalLight(0xff2a5f, 4.0); // Vermelho Neon intenso
            neonEsquerdo.position.set(-5, 2, 4);
            
            const neonDireito = new THREE.DirectionalLight(0x00bfff, 3.5); // Azul Ciano intenso
            neonDireito.position.set(5, 1, 4);
            
            cena.add(neonEsquerdo, neonDireito);

            modeloGrupo = new THREE.Group();
            cena.add(modeloGrupo);

            construirGeometriaKaiyo();
        }

        function construirGeometriaKaiyo() {
            // PINTURA DO CORPO: Cor de pele bronzeada anime com brilho focado (specular elevado)
            const peleMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffb285,        // Pintura viva para simular pele real e bronzeada
                roughness: 0.12,        // Pele acetinada que reflete os neons do estúdio
                metalness: 0.02,
                flatShading: false
            });

            const cabeloMaterial = new THREE.MeshStandardMaterial({ color: 0x141419, roughness: 0.5 });

            // 1. ROSTO
            objetoAvatar.rosto = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 32), peleMaterial);
            objetoAvatar.rosto.scale.set(1, 1.3, 0.95);
            objetoAvatar.rosto.position.y = 0.75;
            modeloGrupo.add(objetoAvatar.rosto);

            // 2. CABELO + ORELHAS
            objetoAvatar.cabelo = new THREE.Group();
            const crinaBase = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), cabeloMaterial);
            crinaBase.position.set(0, 0.85, -0.05);
            objetoAvatar.cabelo.add(crinaBase);

            const orelhaE = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), cabeloMaterial);
            orelhaE.position.set(-0.26, 1.3, 0); orelhaE.rotation.z = 0.2;
            const orelhaD = orelhaE.clone(); orelhaD.position.x = 0.26; orelhaD.rotation.z = -0.2;
            objetoAvatar.cabelo.add(orelhaE, orelhaD);
            modeloGrupo.add(objetoAvatar.cabelo);

            // 3. OLHOS
            objetoAvatar.olho = new THREE.Group();
            const materialIris = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const materialPupila = new THREE.MeshBasicMaterial({ color: 0x050505 });

            const irisE = new THREE.Mesh(new THREE.SphereGeometry(0.048, 16, 16), materialIris);
            irisE.position.set(-0.15, 0.8, 0.42);
            irisE.scale.set(1.4, 1, 0.4);
            const pupilaE = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), materialPupila);
            pupilaE.position.set(-0.15, 0.8, 0.45);
            pupilaE.scale.set(0.6, 1.2, 0.2);

            const irisD = irisE.clone(); irisD.position.x = 0.15;
            const pupilaD = pupilaE.clone(); pupilaD.position.x = 0.15;
            objetoAvatar.olho.add(irisE, pupilaE, irisD, pupilaD);
            modeloGrupo.add(objetoAvatar.olho);

            // 4. PEITORAL ESCULPIDO
            objetoAvatar.peitoral = new THREE.Group();
            const peitoE = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 16), peleMaterial);
            peitoE.position.set(-0.24, -0.05, 0.15); peitoE.scale.set(1, 0.78, 0.55);
            const peitoD = peitoE.clone(); peitoD.position.x = 0.24;
            objetoAvatar.peitoral.add(peitoE, peitoD);

            // Abdômen de suporte reajustado para trás
            const abdBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.45, 1.5, 32), peleMaterial);
            abdBase.position.y = -0.6;
            objetoAvatar.peitoral.add(abdBase);
            modeloGrupo.add(objetoAvatar.peitoral); // Colocado no grupo móvel para rotacionar junto!

            // 5. TANQUINHO CORRIGIDO (Puxado totalmente para o centro e saltado para frente)
            objetoAvatar.tanquinhos = new THREE.Group();
            for(let i = 0; i < 4; i++) {
                const gomoE = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), peleMaterial);
                // Escala alargada e saltada para fora do abdômen base
                gomoE.scale.set(1.15, 0.65, 0.5); 
                
                // Posição X fechada para o centro (-0.11), e Z jogado para frente (0.48) eliminando o bug
                gomoE.position.set(-0.11, -0.32 - (i * 0.17), 0.48 - (i * 0.04));
                
                const gomoD = gomoE.clone(); 
                gomoD.position.x = 0.11; // Centro simétrico direito
                
                objetoAvatar.tanquinhos.add(gomoE, gomoD);
            }
            modeloGrupo.add(objetoAvatar.tanquinhos); // Agora gira perfeitamente acompanhando seu corpo!
        }

        async function cicloRastreamentoVapor() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && detectorRosto) {
                const faces = await detectorRosto.estimateFaces(video, { flipHorizontal: true });

                if (faces.length > 0) {
                    const pontos = faces[0].keypoints;
                    const nariz = pontos[4];
                    const olhoE = pontos[33];
                    const olhoD = pontos[263];

                    if (nariz && olhoE && olhoD) {
                        const deltaX = olhoD.x - olhoE.x;
                        const deltaY = olhoD.y - olhoE.y;

                        const rotaçãoY = Math.atan2(nariz.x - (olhoE.x + deltaX / 2), 140);
                        const rotaçãoX = Math.atan2(nariz.y - (olhoE.y + deltaY / 2), 140);
                        const rotaçãoZ = Math.atan2(deltaY, deltaX);

                        // Rotação unificada em tempo real para todo o conjunto do avatar
                        modeloGrupo.rotation.y += (rotaçãoY * 1.5 - modeloGrupo.rotation.y) * 0.22;
                        modeloGrupo.rotation.x += (rotaçãoX * 1.2 - modeloGrupo.rotation.x) * 0.22;
                        modeloGrupo.rotation.z += (rotaçãoZ - modeloGrupo.rotation.z) * 0.22;
                    }
                }
            }
            
            if (renderizador && cena && camera) {
                renderizador.render(cena, camera);
            }
            requestAnimationFrame(cicloRastreamentoVapor);
        }

        function alternarElemento(tipo) {
            if(objetoAvatar[tipo]) {
                objetoAvatar[tipo].visible = !objetoAvatar[tipo].visible;
                const btn = document.getElementById(`btn-${tipo}`);
                btn.classList.toggle('ativo', objetoAvatar[tipo].visible);
                btn.querySelector('span').innerText = objetoAvatar[tipo].visible ? 'ON' : 'OFF';
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
