<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiyo VTuber Live 3D Tracking</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050508; font-family: 'Segoe UI', sans-serif; }
        
        #app-container { position: relative; width: 100%; height: 100%; display: flex; }

        /* Webcam invisível ou em miniatura para monitoramento */
        #webcam {
            position: absolute;
            top: 10px; left: 10px; width: 120px; height: 90px;
            object-fit: cover; transform: scaleX(-1);
            border-radius: 8px; border: 2px solid #ff4757;
            z-index: 5; opacity: 0.7;
        }

        #renderer-3d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }

        /* Menu Lateral Otimizado */
        .menu-controles {
            position: absolute;
            right: 20px; top: 50%;
            transform: translateY(-50%);
            width: 260px;
            background: rgba(10, 10, 15, 0.9);
            border-radius: 16px;
            padding: 16px;
            z-index: 10;
            color: white;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 71, 87, 0.4);
            box-shadow: 0px 0px 30px rgba(0,0,0,0.7);
        }

        .menu-titulo {
            text-align: center;
            margin-bottom: 15px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            color: #ff4757;
        }

        .grid-opcoes {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .btn-opcao {
            background: #15151c;
            color: #858595;
            border: 1px solid #252530;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-opcao.ativo {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            border-color: #ff8b94;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.3);
        }

        #container-aviso {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #0a0a0f; color: white; text-align: center; padding: 25px; z-index: 20;
        }

        .btn-permitir {
            background: #ff4757; color: white; border: none;
            padding: 16px 40px; font-size: 14px; font-weight: bold;
            border-radius: 30px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection" crossorigin="anonymous"></script>
</head>
<body>

    <div id="app-container">
        <div id="container-aviso">
            <p style="margin-bottom: 20px; color: #a4b0be;">Carregando o Reconhecimento Facial Inteligente do Kaiyo v2.5...</p>
            <button class="btn-permitir" onclick="inicializarSistema()">Ligar Rastreamento Face 3D</button>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <div id="renderer-3d"></div>

        <div class="menu-controles">
            <div class="menu-titulo">Módulos de Rastreamento</div>
            <div class="grid-opcoes">
                <button class="btn-opcao ativo" id="btn-rosto" onclick="alternarMódulo('rosto')">Rosto <span>HD</span></button>
                <button class="btn-opcao ativo" id="btn-cabelo" onclick="alternarMódulo('cabelo')">Cabelo + Orelhas <span>HD</span></button>
                <button class="btn-opcao ativo" id="btn-olho" onclick="alternarMódulo('olho')">Olhos Dinâmicos</button>
                <button class="btn-opcao ativo" id="btn-nariz" onclick="alternarMódulo('nariz')">Nariz</button>
                <button class="btn-opcao ativo" id="btn-boca" onclick="alternarMódulo('boca')">Boca Tridimensional</button>
                <button class="btn-opcao ativo" id="btn-peitoral" onclick="alternarMódulo('peitoral')">Peitoral Kaiyo</button>
                <button class="btn-opcao ativo" id="btn-tanquinhos" onclick="alternarMódulo('tanquinhos')">Tanquinho Definido</button>
                <button class="btn-opcao" id="btn-roupa" onclick="alternarMódulo('roupa')">Roupa Militar</button>
                <button class="btn-opcao" id="btn-calca" onclick="alternarMódulo('calca')">Calça Tática</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const painelAviso = document.getElementById('container-aviso');
        
        let cena, camera, renderizador, modeloGrupo;
        let detectorRosto;
        let objetoAvatar = {};
        const estadoMódulos = { rosto: true, cabelo: true, olho: true, nariz: true, boca: true, peitoral: true, tanquinhos: true, roupa: false, calca: false };

        async function inicializarSistema() {
            try {
                // 1. Liga a câmera do dispositivo
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 }, audio: false 
                });
                video.srcObject = stream;

                // 2. Inicializa o Reconhecimento Facial do Google
                const modeloDeteccao = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
                detectorRosto = await faceLandmarksDetection.createDetector(modeloDeteccao, {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh'
                });

                painelAviso.style.display = 'none';
                
                // 3. Start no Motor Gráfico
                initEngine3D();
                rastrearRostoLoop();

            } catch (err) {
                console.error(err);
                alert("Erro ao iniciar IA ou Câmera. Verifique se está usando HTTPS.");
            }
        }

        function initEngine3D() {
            const container = document.getElementById('renderer-3d');
            cena = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-0.4, 0, 5.0);

            renderizador = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderizador.setSize(window.innerWidth, window.innerHeight);
            renderizador.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderizador.domElement);

            // Grupo principal que vai girar baseado na sua cabeça
            modeloGrupo = new THREE.Group();
            cena.add(modeloGrupo);

            // Iluminação Avançada Cyberpunk
            cena.add(new THREE.AmbientLight(0x444455, 1.5));
            
            const luzVermelha = new THREE.DirectionalLight(0xff3366, 3.0);
            luzVermelha.position.set(-3, 2, 2);
            cena.add(luzVermelha);

            const luzAzul = new THREE.DirectionalLight(0x00ccff, 2.5);
            luzAzul.position.set(3, 1, 2);
            cena.add(luzAzul);

            construirKaiyoPro();
            window.addEventListener('resize', onWindowResize);
        }

        function construirKaiyoPro() {
            // Texturização via Shaders Simples com Gradiente Orgânico para simular pintura digital (Igual YouTube do Kaiyo)
            const peleMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd5bc, roughness: 0.18, metalness: 0.02
            });
            const cabeloMaterial = new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.4 });
            const olhoMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

            // CABEÇA (Subgrupo que responde diretamente ao tracking)
            objetoAvatar.rosto = new THREE.Mesh(new THREE.SubdivisionModifier ? null : new THREE.SphereGeometry(0.5, 32, 32), peleMaterial);
            objetoAvatar.rosto.scale.set(1, 1.3, 0.95);
            objetoAvatar.rosto.position.y = 0.6;
            modeloGrupo.add(objetoAvatar.rosto);

            // CABELO ANIME + ORELHAS DE LOBO
            objetoAvatar.cabelo = new THREE.Group();
            const calotaCabelo = new THREE.Mesh(new THREE.SphereGeometry(0.54, 16, 16), cabeloMaterial);
            calotaCabelo.position.set(0, 0.7, -0.05);
            objetoAvatar.cabelo.add(calotaCabelo);

            // Orelhas Pontudas do Kaiyo
            const orelhaE = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.4, 4), cabeloMaterial);
            orelhaE.position.set(-0.3, 1.2, 0); orelhaE.rotation.z = 0.25;
            const orelhaD = orelhaE.clone(); orelhaD.position.x = 0.3; orelhaD.rotation.z = -0.25;
            objetoAvatar.cabelo.add(orelhaE, orelhaD);
            modeloGrupo.add(objetoAvatar.cabelo);

            // OLHOS
            objetoAvatar.olho = new THREE.Group();
            const irisE = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), olhoMaterial);
            irisE.position.set(-0.18, 0.65, 0.42);
            const irisD = irisE.clone(); irisD.position.x = 0.18;
            objetoAvatar.olho.add(irisE, irisD);
            modeloGrupo.add(objetoAvatar.olho);

            // PEITORAL ANATOMIA ANIME (Corpo fixo ou com balanço leve)
            objetoAvatar.peitoral = new THREE.Group();
            const peitoEsquerdo = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 16), peleMaterial);
            peitoEsquerdo.position.set(-0.28, -0.2, 0.1);
            peitoEsquerdo.scale.set(1, 0.75, 0.6);
            const peitoDireito = peitoEsquerdo.clone(); peitoDireito.position.x = 0.28;
            objetoAvatar.peitoral.add(peitoEsquerdo, peitoDireito);

            const abdômenBase = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.5, 1.4, 32), peleMaterial);
            abdômenBase.position.y = -0.7;
            objetoAvatar.peitoral.add(abdômenBase);
            cena.add(objetoAvatar.peitoral); // Fica na cena base para dar estabilidade

            // TANQUINHO REALISTA EXTREMO
            objetoAvatar.tanquinhos = new THREE.Group();
            for(let i = 0; i < 4; i++) {
                const gomo = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), peleMaterial);
                gomo.scale.set(1.1, 0.65, 0.4);
                gomo.position.set(-0.14, -0.45 - (i * 0.18), 0.42);
                const gomoD = gomo.clone(); gomoD.position.x = 0.14;
                objetoAvatar.tanquinhos.add(gomo, gomoD);
            }
            cena.add(objetoAvatar.tanquinhos);
        }

        // LOOP DE INTELIGÊNCIA ARTIFICIAL: FAZ O MODELO VIRAR CONFORME O SEU ROSTO
        async function rastrearRostoLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && detectorRosto) {
                const faces = await detectorRosto.estimateFaces(video, { flipHorizontal: true });

                if (faces.length > 0) {
                    const pontos = faces[0].keypoints;
                    
                    // Captura os pontos chave dos olhos, nariz e testa para calcular a rotação em 3D
                    const nariz = pontos[4];
                    const olhoEsquerdo = pontos[33];
                    const olhoDireito = pontos[263];

                    if (nariz && olhoEsquerdo && olhoDireito) {
                        // Cálculo vetorial básico de inclinação (Yaw, Pitch e Roll)
                        const deltaX = olhoDireito.x - olhoEsquerdo.x;
                        const deltaY = olhoDireito.y - olhoEsquerdo.y;

                        // Rotação Lateral (Vira para esquerda/direita)
                        const rotacaoY = Math.atan2(nariz.x - (olhoEsquerdo.x + deltaX / 2), 150);
                        // Rotação Vertical (Olha para cima/baixo)
                        const rotacaoX = Math.atan2(nariz.y - (olhoEsquerdo.y + deltaY / 2), 150);

                        // Aplica os movimentos suavizados (Interpolação Linear Lerp) no modelo do Kaiyo
                        modeloGrupo.rotation.y += (rotacaoY * 1.5 - modeloGrupo.rotation.y) * 0.2;
                        modeloGrupo.rotation.x += (rotacaoX * 1.2 - modeloGrupo.rotation.x) * 0.2;
                    }
                }
            }
            
            // Renderiza as atualizações na tela continuamente
            renderizador.render(cena, camera);
            requestAnimationFrame(rastrearRostoLoop);
        }

        function alternarMódulo(tipo) {
            estadoMódulos[tipo] = !estadoMódulos[tipo];
            if(objetoAvatar[tipo]) objetoAvatar[tipo].visible = estadoMódulos[tipo];
            document.getElementById(`btn-${tipo}`).classList.toggle('ativo', estadoMódulos[tipo]);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
