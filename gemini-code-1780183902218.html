<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiyo Live 3D - Ultra Edition</title>
    <style>
        /* CSS PREMIUM CYBERPUNK */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #030305; 
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
        }
        
        #app-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center;
            justify-content: flex-end;
        }

        /* Preview da Câmera em Miniatura HUD Style */
        #webcam {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            width: 140px; 
            height: 105px;
            object-fit: cover; 
            transform: scaleX(-1); 
            border-radius: 12px;
            border: 2px solid rgba(255, 71, 87, 0.6); 
            z-index: 5; 
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }

        /* Canvas do Motor 3D */
        #renderer-3d { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
        }

        /* Painel Lateral de Elite (Glassmorphism) */
        .menu-controles {
            position: relative;
            margin-right: 30px;
            width: 300px; 
            background: rgba(6, 6, 10, 0.75); 
            border-radius: 24px;
            padding: 24px; 
            z-index: 10; 
            color: white; 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 71, 87, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 71, 87, 0.05);
            transition: border-color 0.3s ease;
        }
        
        .menu-controles:hover {
            border-color: rgba(255, 71, 87, 0.5);
        }

        .menu-titulo { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900; 
            color: #ff4757; 
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .grid-opcoes { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        /* Botões Estilo Jogos Sci-Fi */
        .btn-opcao {
            background: rgba(255, 255, 255, 0.03); 
            color: #8f8f9e; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 14px 18px;
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-opcao:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: translateX(-3px);
        }

        .btn-opcao.ativo { 
            background: linear-gradient(135deg, #ff4757, #ff6b81); 
            color: #fff; 
            border-color: #ff8b94; 
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
        
        .btn-opcao span {
            font-size: 9px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .btn-opcao.ativo span {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Tela de Setup Inicial */
        #container-aviso {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #060609; color: white; z-index: 20;
        }
        
        #container-aviso p {
            font-size: 15px;
            letter-spacing: 1px;
            color: #a4b0be;
            margin-bottom: 25px;
        }

        .btn-permitir {
            background: #ff4757; 
            color: white; 
            border: none; 
            padding: 18px 45px;
            font-size: 13px; 
            font-weight: 800; 
            border-radius: 40px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
            transition: all 0.2s ease;
        }
        .btn-permitir:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.7);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection" crossorigin="anonymous"></script>
</head>
<body>

    <div id="app-container">
        <div id="container-aviso">
            <p>CONECTANDO AO ENGINE INTAKE KAIYO EM ULTRA HD...</p>
            <button class="btn-permitir" onclick="inicializarSistemaCompleto()">Iniciar Rastreamento Tracking</button>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <div id="renderer-3d"></div>

        <div class="menu-controles">
            <div class="menu-titulo">Módulos de Elite Kaiyo</div>
            <div class="grid-opcoes">
                <button class="btn-opcao ativo" id="btn-rosto" onclick="alternarElemento('rosto')">Estrutura Rosto <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-cabelo" onclick="alternarElemento('cabelo')">Cabelo + Orelhas <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-olho" onclick="alternarElemento('olho')">Olhos Dourados <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-peitoral" onclick="alternarElemento('peitoral')">Peitoral Esculpido <span>ON</span></button>
                <button class="btn-opcao ativo" id="btn-tanquinhos" onclick="alternarElemento('tanquinhos')">Tanquinho 8-Pack <span>ON</span></button>
            </div>
        </div>
    </div>

    <script>
        // SCRIPT UNIFICADO INTEGRADO
        const video = document.getElementById('webcam');
        const painelAviso = document.getElementById('container-aviso');
        
        let cena, camera, renderizador, modeloGrupo;
        let detectorRosto;
        let objetoAvatar = {};
        
        // Inicialização unificada
        async function inicializarSistemaCompleto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 }, audio: false 
                });
                video.srcObject = stream;

                const modeloDeteccao = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
                detectorRosto = await faceLandmarksDetection.createDetector(modeloDeteccao, {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh'
                });

                painelAviso.style.display = 'none';
                
                initMundo3D();
                cicloRastreamentoVapor();

            } catch (err) {
                console.error(err);
                alert("Erro crítico ao acessar mídia ou carregar scripts de IA.");
            }
        }

        // Configuração do ambiente Gráfico (Equivalente à IA de Cria Diferenças)
        function initMundo3D() {
            const container = document.getElementById('renderer-3d');
            cena = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Posicionamento estratégico para compensar o lindo menu lateral
            camera.position.set(-0.6, 0.1, 4.8);

            renderizador = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderizador.setSize(window.innerWidth, window.innerHeight);
            renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderizador.domElement);

            // Setup de Luzes Cinematográficas
            cena.add(new THREE.AmbientLight(0x44445c, 1.8));
            
            const neonEsquerdo = new THREE.DirectionalLight(0xff3366, 3.5); // Rosa/Vermelho Intenso
            neonEsquerdo.position.set(-4, 2, 3);
            
            const neonDireito = new THREE.DirectionalLight(0x00ccff, 3.0); // Azul Cyber tático
            neonDireito.position.set(4, 1, 3);
            
            cena.add(neonEsquerdo, neonDireito);

            modeloGrupo = new THREE.Group();
            cena.add(modeloGrupo);

            construirGeometriaKaiyo();
        }

        // Construção Avançada do Avatar
        function construirGeometriaKaiyo() {
            // Material Orgânico Acetinado de Alta Performance
            const peleMaterial = new THREE.MeshStandardMaterial({ color: 0xffd5bc, roughness: 0.16, metalness: 0.03 });
            const cabeloMaterial = new THREE.MeshStandardMaterial({ color: 0x191920, roughness: 0.45 });

            // 1. ROSTO
            objetoAvatar.rosto = new THREE.Mesh(new THREE.SphereGeometry(0.48, 32, 32), peleMaterial);
            objetoAvatar.rosto.scale.set(1, 1.32, 0.95);
            objetoAvatar.rosto.position.y = 0.65;
            modeloGrupo.add(objetoAvatar.rosto);

            // 2. CABELO + ORELHAS DE LOBO (Integrados)
            objetoAvatar.cabelo = new THREE.Group();
            const crinaBase = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 16), cabeloMaterial);
            crinaBase.position.set(0, 0.75, -0.05);
            objetoAvatar.cabelo.add(crinaBase);

            // Orelhas de lobo esculpidas simetricamente
            const orelhaE = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42, 4), cabeloMaterial);
            orelhaE.position.set(-0.28, 1.25, 0); orelhaE.rotation.z = 0.22;
            const orelhaD = orelhaE.clone(); orelhaD.position.x = 0.28; orelhaD.rotation.z = -0.22;
            objetoAvatar.cabelo.add(orelhaE, orelhaD);
            modeloGrupo.add(objetoAvatar.cabelo);

            // 3. GENERADOR DE OLHOS (Lógica integrada da antiga IA Olho)
            objetoAvatar.olho = new THREE.Group();
            const materialIris = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const materialPupila = new THREE.MeshBasicMaterial({ color: 0x0a0a0d });

            const irisE = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), materialIris);
            irisE.position.set(-0.16, 0.7, 0.42);
            irisE.scale.set(1.4, 1, 0.4);
            const pupilaE = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), materialPupila);
            pupilaE.position.set(-0.16, 0.7, 0.45);
            pupilaE.scale.set(0.6, 1.2, 0.2); // Formato felino agressivo

            const irisD = irisE.clone(); irisD.position.x = 0.16;
            const pupilaD = pupilaE.clone(); pupilaD.position.x = 0.16;
            objetoAvatar.olho.add(irisE, pupilaE, irisD, pupilaD);
            modeloGrupo.add(objetoAvatar.olho);

            // 4. ANATOMIA DE MÚSCULOS PEITORAL SUPER-DEFINIDOS
            objetoAvatar.peitoral = new THREE.Group();
            const peitoE = new THREE.Mesh(new THREE.SphereGeometry(0.44, 32, 16), peleMaterial);
            peitoE.position.set(-0.26, -0.15, 0.12); peitoE.scale.set(1, 0.76, 0.55);
            const peitoD = peitoE.clone(); peitoD.position.x = 0.26;
            objetoAvatar.peitoral.add(peitoE, peitoD);

            const abdBase = new THREE.Mesh(new THREE.CylinderGeometry(0.64, 0.48, 1.4, 32), peleMaterial);
            abdBase.position.y = -0.65;
            objetoAvatar.peitoral.add(abdBase);
            cena.add(objetoAvatar.peitoral);

            // 5. PACK DE 8 GOMOS DE TANQUINHO HIPER-REALISTAS
            objetoAvatar.tanquinhos = new THREE.Group();
            for(let i = 0; i < 4; i++) {
                const gomoE = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), peleMaterial);
                gomoE.scale.set(1.15, 0.62, 0.42); 
                gomoE.position.set(-0.13, -0.42 - (i * 0.18), 0.43);
                const gomoD = gomoE.clone(); gomoD.position.x = 0.13;
                objetoAvatar.tanquinhos.add(gomoE, gomoD);
            }
            cena.add(objetoAvatar.tanquinhos);
        }

        // EXECUÇÃO DO SEU TRACKING DE ROSTO TOTAL (Antigo IA Vira Boneco)
        async function cicloRastreamentoVapor() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && detectorRosto) {
                const faces = await detectorRosto.estimateFaces(video, { flipHorizontal: true });

                if (faces.length > 0) {
                    const pontos = faces[0].keypoints;
                    const nariz = pontos[4];
                    const olhoE = pontos[33];
                    const olhoD = pontos[263];

                    if (nariz && olhoE && olhoD) {
                        const deltaX = olhoD.x - olhoE.x;
                        const deltaY = olhoD.y - olhoE.y;

                        // Cálculos matemáticos de angulação 3D precisos (Eixos X, Y e Z)
                        const rotaçãoY = Math.atan2(nariz.x - (olhoE.x + deltaX / 2), 140);
                        const rotaçãoX = Math.atan2(nariz.y - (olhoE.y + deltaY / 2), 140);
                        const rotaçãoZ = Math.atan2(deltaY, deltaX);

                        // Interpolação suave (Lerp) para movimentos sem travamentos
                        modeloGrupo.rotation.y += (rotaçãoY * 1.6 - modeloGrupo.rotation.y) * 0.22;
                        modeloGrupo.rotation.x += (rotaçãoX * 1.3 - modeloGrupo.rotation.x) * 0.22;
                        modeloGrupo.rotation.z += (rotaçãoZ - modeloGrupo.rotation.z) * 0.22;
                    }
                }
            }
            
            if (renderizador && cena && camera) {
                renderizador.render(cena, camera);
            }
            requestAnimationFrame(cicloRastreamentoVapor);
        }

        function alternarElemento(tipo) {
            if(objetoAvatar[tipo]) {
                objetoAvatar[tipo].visible = !objetoAvatar[tipo].visible;
                const btn = document.getElementById(`btn-${tipo}`);
                btn.classList.toggle('ativo', objetoAvatar[tipo].visible);
                btn.querySelector('span').innerText = objetoAvatar[tipo].visible ? 'ON' : 'OFF';
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
